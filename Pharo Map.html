<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PHARO MAP – Explore Egypt in 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ink:#12233f;--sub:#6b6a66;--card:#f8eedc;--card2:#fff8ea;--line:#e5d5b6;--teal:#0f5a63;--gold:#b8741a;--sky1:#f7e6cc;--sky2:#efd3a4;--ok:#1b7f3b;--bad:#b3392d;--page:#f3e7d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1e8d6;--sub:#b3a88f;--card:#1f2b3c;--card2:#273548;--line:#38465a;--teal:#2a8f9b;--gold:#e0a040;--sky1:#27344a;--sky2:#3a3f4a;--ok:#4cc16f;--bad:#ef7b6e;--page:#141d2b}}
:root[data-theme="dark"]{--ink:#f1e8d6;--sub:#b3a88f;--card:#1f2b3c;--card2:#273548;--line:#38465a;--teal:#2a8f9b;--gold:#e0a040;--sky1:#27344a;--sky2:#3a3f4a;--ok:#4cc16f;--bad:#ef7b6e;--page:#141d2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}body{background:#cdb68a;font:16px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{position:relative;width:100%;max-width:440px;height:100%;max-height:900px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 30%,#1d4e7a 34%,#d3a05f 70%);align-self:center}
@media(min-width:500px){.app{border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);height:min(100%,860px)}}
.top{position:absolute;left:0;right:0;top:0;padding:14px 16px 0;z-index:5;background:linear-gradient(var(--sky1) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:30px;letter-spacing:.5px;font-weight:800;flex:1}
.circ{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.search{margin-top:10px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:0 16px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.search input{flex:1;border:0;background:none;outline:0;font-size:17px;min-width:0}
h1.t{font-size:36px;margin:10px 0 8px;font-weight:800;line-height:1.1}
.chips{display:flex;gap:8px;padding-bottom:10px}.chip{border:0;background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;display:flex;gap:6px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}.chip.on{background:var(--teal);color:#fff}
#res{position:absolute;left:16px;right:16px;top:132px;background:var(--card2);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:9;display:none;overflow:hidden}
#res div{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mapw{position:absolute;left:0;right:0;top:218px;aspect-ratio:941/865;overflow:hidden;z-index:1;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 90%,transparent)}
.layer{position:absolute;inset:0;transition:transform .35s;transform-origin:50% 50%}.layer img{width:100%;height:100%;display:block}
.hs{position:absolute;border-radius:14px;cursor:pointer;border:2px solid transparent;transition:.2s}
.hs.sel{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 0 24px rgba(255,255,255,.7);animation:p 1.6s infinite}.hs.dim{opacity:.0}
.hs.hl{border-color:var(--gold)}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(255,255,255,.15),0 0 30px rgba(255,255,255,.9)}}
.pin{position:absolute;transform:translateX(-50%);background:rgba(18,35,63,.88);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
.ctl{position:absolute;z-index:3;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2);border:0;display:grid;place-items:center}
.zm{left:3%;top:74%;width:9.4%;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}.zm button{border:0;background:none;font-size:28px;height:44px;line-height:1}
.loc{right:2.5%;top:3%;width:9.6%;aspect-ratio:1;border-radius:50%}
.card{position:absolute;left:12px;right:12px;bottom:84px;z-index:4;background:var(--card);border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.card img{width:108px;height:84px;object-fit:cover;border-radius:12px}.card h3{margin:0 0 2px;font-size:19px}.card .go{border:0;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 14px;font-weight:600;white-space:nowrap}
.card .meta{font-size:14px}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.star{color:var(--gold)}
nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--card);display:flex;z-index:20;border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;color:var(--ink);border-bottom:3px solid transparent;margin:0 10px}nav button.on{color:var(--gold);border-color:var(--gold)}
.scr{position:absolute;inset:0 0 74px 0;background:var(--page);overflow:auto;z-index:10;padding:16px}
.hero{height:200px;border-radius:18px;background-size:cover;background-position:center;position:relative;margin-bottom:12px}
.back{position:absolute;left:10px;top:10px}
.pan{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}.pan h4{margin:0 0 6px;font-size:16px}
.sub{color:var(--sub);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:14px;padding:11px 16px;background:var(--ink);color:var(--card);font-weight:600}.btn.g{background:var(--card2);color:var(--ink);border:1px solid var(--line)}.btn.t{background:var(--teal);color:#fff}
input.f,textarea,select.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);margin-top:6px}
.fb{border-top:1px solid var(--line);padding:8px 0}
#chat{display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:46vh;overflow:auto;padding:4px 0}
.m{max-width:90%;padding:10px 12px;border-radius:14px}.u{align-self:flex-end;background:var(--teal);color:#fff}.b{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
ol.it{padding-left:20px;margin:6px 0}.toast{position:absolute;left:50%;top:210px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:999px;z-index:30;font-size:14px;display:none}

const hav=(a,b,c,d)=>{const q=x=>x*Math.PI/180,u=q(c-a),v=q(d-b),k=Math.sin(u/2)**2+Math.cos(q(a))*Math.cos(q(c))*Math.sin(v/2)**2;return 12742*Math.asin(Math.sqrt(k))*1.3},tt=d=>d>350?150:d/(d<60?35:70)*60+5;
const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
function plan(t){let ids=Object.keys(KW).filter(k=>KW[k].test(t));if(!ids.length)ids=['giza','sphinx','gem'];let sc=$('#st').value;Object.keys(C).forEach(c=>{if(new RegExp('from '+c,'i').test(t))sc=c});const[s,e]=times(t),o=C[sc];let best=null;
for(const p of perms(ids)){let at=s,pos=o,out=[],skip=[];for(const id of p){const l=L.find(x=>x.id===id),d=hav(pos[0],pos[1],l.lat,l.lon),tr=tt(d),arr=at+tr,st=Math.max(arr,l.o);if(st+l.v>l.c||st+l.v>e){skip.push([l,st+l.v>l.c?'it closes before you could finish':'it does not fit your time window']);continue}out.push({l,d,tr,arr,st,w:st-arr,end:st+l.v});at=st+l.v;pos=[l.lat,l.lon]}if(!best||out.length>best.out.length||(out.length===best.out.length&&at<best.at))best={out,skip,at}}
if(!best.out.length)return'None of those fit your time window. Try a longer day or fewer landmarks.';let h=`<b>Best route from ${sc}, ${hm(s)} – ${hm(e)}</b><ol class="it">`;
best.out.forEach(x=>h+=`<li><b>${x.l.n}</b><br>Travel ${Math.round(x.d)} km (${Math.round(x.tr)} min${x.d>350?', flight recommended':''}), arrive ${hm(x.arr)}${x.w>1?`, wait for opening at ${hm(x.l.o)}`:''}.<br>Visit ${hm(x.st)} – ${hm(x.end)}</li>`);h+='</ol>';best.skip.forEach(([l,r])=>h+=`<div class="sub">Skipped ${l.n}: ${r}.</div>`);return h+`<div class="sub">Finish around ${hm(best.at)}. Most landmarks within opening hours, then earliest finish.</div>`}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-f],[data-d],[data-id],[data-back],[data-post],[data-plan],[data-save]');if(e.target.closest('#zi')){zoom=Math.min(1.7,zoom+.3);drawMap();return}if(e.target.closest('#zo')){zoom=Math.max(1,zoom-.3);drawMap();return}if(e.target.closest('#loc')){zoom=1;drawMap();toast('Centered on Egypt (demo location)');return}if(e.target.closest('#prof')){det=null;tab='prof';show();return}
if(!e.target.closest('#res')&&!e.target.closest('.search'))$('#res').style.display='none';if(!t)return;const d=t.dataset;
if(d.t){tab=d.t;det=null;show()}else if(d.f){flt=d.f;chips();drawMap()}else if(d.id){if(sel===d.id)det=d.id,show();else pick(d.id)}else if(d.d){det=d.d;show()}else if(d.back){det=null;show()}
else if(d.plan){window._pre=L.find(x=>x.id===d.plan).n+' from 9am to 5pm';det=null;tab='ai';show()}else if(d.save){const i=saved.indexOf(d.save);i<0?saved.push(d.save):saved.splice(i,1);try{localStorage.setItem('sv',JSON.stringify(saved))}catch(x){}show()}
else if(d.post){const l=L.find(x=>x.id===d.post),c=$('#fc').value.trim();if(!c)return;l.fb.unshift([$('#fn').value.trim()||'Guest',+$('#fr').value,c]);show()}});
$('#q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase(),r=$('#res'),m=v?L.filter(l=>l.n.toLowerCase().includes(v)):[];r.innerHTML=m.map(l=>`<div data-s="${l.id}">${l.n}<div class="sub">${l.city}</div></div>`).join('');r.style.display=m.length?'block':'none'});
$('#res').addEventListener('click',e=>{const d=e.target.closest('[data-s]');if(d){pick(d.dataset.s);$('#res').style.display='none';$('#q').value=''}});
chips();drawMap();card();show();
</script></body></html>
